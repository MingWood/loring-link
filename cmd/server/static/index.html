<!DOCTYPE html>
<html>
<head>
<title>Super Good Loring Control UI</title>
<style>
  :root {
    --giant-cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128' viewBox='0 0 32 32'><polygon points='0,0 0,22 6,17 10,25 13,23 9,15 17,15' fill='black' stroke='white' stroke-width='1'/></svg>") 4 4, auto;
  }

  html, body, button, a, label, input {
    cursor: var(--giant-cursor);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-height: 100vh;
  }

  #buttons {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 6px;
    margin: 10px 0;
  }

  #buttons button {
    width: 100%;
  }
</style>
</head>
<body>

<h1>Super Good Loring Control UI</h1>

<div id="roasterOptions">
  <label>Select Loring:</label>
  <label><input type="radio" name="roaster" value="S7" checked> S7</label>
  <label><input type="radio" name="roaster" value="S15"> S15</label>
  <label><input type="radio" name="roaster" value="S35"> S35</label>
</div>

<p>Set gas burner setting to the digits of Pi:</p>

<div id="buttons"></div>

<h1 style="margin-top: 0"><button onclick="feelingLucky()">✨I'm feeling lucky✨</button></h1>

<p>Trigger roaster actions:</p>
<div id="actionButtons"  style="margin-bottom: 50px">
  <button id="coolerFanBtn">Cooler Fan</button>
  <button id="dropBtn">Drop (hold 1s)</button>
</div>

<div>
  <a href="#" onclick="event.preventDefault(); alert('feature planned for Q2 of 2092');">&#8594; Go to page 2 for odd number gas values</a>
</div>
<a href="/entry">&#8594; Switch to an even more advanced UI</a>

<script>
function selectedRoaster() {
  var radios = document.getElementsByName('roaster');
  for (var i = 0; i < radios.length; i++) {
    if (radios[i].checked) {
      return radios[i].value;
    }
  }
  return 'S7';
}

function withRoasterIP(payload) {
  var roaster = selectedRoaster();
  if (roaster === 'S15' || roaster === 'S35') {
    payload.ip = '192.168.1.199';
  }
  return payload;
}

function feelingLucky() {
  var min = 20, max = 100, step = 2;
  var steps = (max - min) / step + 1;
  var value = min + Math.floor(Math.random() * steps) * step;
  sendGas(value);
}

function sendGas(value) {
  var payload = withRoasterIP({ value: value });

  fetch('http://127.0.0.1:8080/gas', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
    .then(function (res) { return res.text(); })
    .then(function (text) { console.log('gas=' + value + ' response: ' + text); })
    .catch(function (err) { console.error('gas=' + value + ' failed: ' + err); });
}

function sendCoolerFan() {
  var payload = withRoasterIP({});

  fetch('http://127.0.0.1:8080/coolerfan', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
    .then(function (res) { return res.text(); })
    .then(function (text) { console.log('coolerfan response: ' + text); })
    .catch(function (err) { console.error('coolerfan failed: ' + err); });
}

function sendDrop() {
  var payload = withRoasterIP({});

  fetch('http://127.0.0.1:8080/drop', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
    .then(function (res) { return res.text(); })
    .then(function (text) { console.log('drop response: ' + text); })
    .catch(function (err) { console.error('drop failed: ' + err); });
}

document.getElementById('coolerFanBtn').onclick = function () { sendCoolerFan(); };

var dropBtn = document.getElementById('dropBtn');
var dropHoldTimer = null;

function startDropHold() {
  dropHoldTimer = setTimeout(function () {
    dropHoldTimer = null;
    sendDrop();
  }, 1000);
}

function cancelDropHold() {
  if (dropHoldTimer) {
    clearTimeout(dropHoldTimer);
    dropHoldTimer = null;
  }
}

dropBtn.addEventListener('mousedown', startDropHold);
dropBtn.addEventListener('touchstart', startDropHold);
dropBtn.addEventListener('mouseup', cancelDropHold);
dropBtn.addEventListener('mouseleave', cancelDropHold);
dropBtn.addEventListener('touchend', cancelDropHold);
dropBtn.addEventListener('touchcancel', cancelDropHold);

var piDigitLabels = [
  '3', '14', '15', '92', '65', '35', '89', '79', '32', '38',
  '46', '26', '43', '38', '32', '79', '50', '28', '84', '19',
  '71', '69', '39', '93', '75', '10', '58', '20', '97', '49',
  '44', '59', '23', '07', '81', '64', '06', '28', '62', '08',
  '99'
];

var container = document.getElementById('buttons');
for (var i = 0; i < piDigitLabels.length; i++) {
  (function (label) {
    var value = parseInt(label, 10);
    var btn = document.createElement('button');
    btn.textContent = label;
    btn.onclick = function () { sendGas(value); };
    container.appendChild(btn);
  })(piDigitLabels[i]);

  if (i === 23) {
    var funBtn = document.createElement('button');
    funBtn.textContent = '⁶🤷‍♂️⁷';
    funBtn.onclick = function () { alert('lol no'); };
    container.appendChild(funBtn);
  }
}
</script>

</body>
</html>
